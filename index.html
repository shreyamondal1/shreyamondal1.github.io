<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Shreya Mondal" />
  <meta name="theme-color" content="#f7f7f4" />
  <title>Shreya Mondal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <header class="sitebar">
    <div class="wrap bar-inner">
      <a class="brand" href="#top" aria-label="Home">SM</a>
      <div class="bar-actions">
        <button class="theme" id="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">☾</button>
      </div>
    </div>
  </header>
  <main id="top">
    <section class="hero">
      <div class="wrap hero-grid">
        <div id="hero-content"></div>
        <div class="hero-aside" aria-hidden="true">
          <div class="orbit"></div><div class="monogram">SM</div>
          <div class="orbit-note note-one">DATA → INSIGHT → ACTION</div>
          <div class="orbit-note note-two">AI/ML/DL</div>
          <div class="orbit-note note-three">NLP/RAG/LLM</div>
        </div>
      </div>
    </section>
    <div class="section-index"><div class="wrap index-inner" id="section-index"></div></div>
    <section class="section" id="work">
      <div class="wrap">
        <div class="section-head" id="work-heading"></div>
        <div class="project-grid" id="project-grid"></div>
      </div>
    </section>
    <section class="section" id="approach">
      <div class="wrap">
        <div class="section-head" id="approach-heading"></div>
        <div class="capabilities" id="capabilities-grid"></div>
      </div>
    </section>
    <section class="section" id="background">
      <div class="wrap">
        <div class="section-head" id="background-heading"></div>
        <div class="background-grid">
          <div><p class="eyebrow">Academic foundation & Professional milestones</p><div class="timeline" id="timeline"></div></div>
          <div><p class="eyebrow">Tools I work with</p><div class="skills-list" id="skills-list"></div></div>
        </div>
      </div>
    </section>
    <section class="contact" id="contact">
      <div class="wrap"><div class="contact-panel" id="contact-panel"></div></div>
    </section>
  </main>
  <footer><div class="wrap footer-inner"><span>© <span id="year"></span> Shreya Mondal</span><span id="footer-links"></span></div></footer>
</body>
</html>
